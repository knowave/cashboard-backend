spring:
  application:
    name: cashboard
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cashboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

notification:
  scheduler:
    cron: ${NOTIFICATION_SCHEDULER_CRON:0 0 9 * * *}
    zone: ${NOTIFICATION_TIME_ZONE:Asia/Seoul}

auth:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:cashboard}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:8h}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
  rate-limit:
    per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri:
      ios: ${GOOGLE_REDIRECT_URI_IOS:}
      android: ${GOOGLE_REDIRECT_URI_ANDROID:}
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    userinfo-uri: ${GOOGLE_USERINFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri:
      ios: ${KAKAO_REDIRECT_URI_IOS:}
      android: ${KAKAO_REDIRECT_URI_ANDROID:}
    token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    userinfo-uri: ${KAKAO_USERINFO_URI:https://kapi.kakao.com/v2/user/me}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri:
      ios: ${NAVER_REDIRECT_URI_IOS:}
      android: ${NAVER_REDIRECT_URI_ANDROID:}
    token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
    userinfo-uri: ${NAVER_USERINFO_URI:https://openapi.naver.com/v1/nid/me}
  apple:
    client-id: ${APPLE_CLIENT_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key-b64: ${APPLE_PRIVATE_KEY_B64:}
    redirect-uri:
      # ANDROID + APPLE 조합은 SocialLoginPolicy가 거부하므로 android 값은 두지 않는다.
      ios: ${APPLE_REDIRECT_URI_IOS:}
    token-uri: ${APPLE_TOKEN_URI:https://appleid.apple.com/auth/token}
    jwks-uri: ${APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}

logging:
  pattern:
    console: "[%d{HH:mm:ss.SSS}][%-5level][%logger.%method:line%line] - %msg%n"
  level:
    org:
      hibernate:
        SQL: debug
        type.descriptor.sql: trace

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
